name: Security candidate isolated release and backout rehearsal
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: security-release-rehearsal-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rehearsal:
    if: github.repository == 'NUAAFA/NUAA-Football-Association'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CHECKPOINT_DISABLE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      TZ: UTC
      OLD: 4f21397bf21d1d2afb8f26839dc948965ca822a2
      NEW: 6db56b94c25ca3ce1376dabbda74714448decf53
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: driver
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 6db56b94c25ca3ce1376dabbda74714448decf53
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 4f21397bf21d1d2afb8f26839dc948965ca822a2
          path: previous
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Fresh synthetic builds and exact Linux archives
        run: |
          test "$(cat /proc/1/comm)" = systemd
          test "$(uname -sm)" = 'Linux x86_64'
          test "$(node --version)" = v22.23.4
          mkdir -p "$RUNNER_TEMP/rehearsal-output"
          for pair in "previous:$OLD" "candidate:$NEW"; do
            directory="${pair%%:*}"
            sha="${pair#*:}"
            (
              cd "$GITHUB_WORKSPACE/$directory"
              test "$(git rev-parse HEAD)" = "$sha"
              export DATABASE_URL="file:$RUNNER_TEMP/$directory-synthetic-build.db"
              touch "$RUNNER_TEMP/$directory-synthetic-build.db"
              npm ci --include=dev --include=optional --no-audit --no-fund
              npx prisma migrate deploy
              npm run build
              python3 ops/deploy/prebuilt-artifact.py pack --source="$PWD" --commit="$sha" --output="$RUNNER_TEMP/$sha.tar.gz"
            )
          done
      - name: Actual isolated activation, compatible backout and failure recovery
        run: |
          sudo env "PATH=$PATH" "GITHUB_ACTIONS=true" "RUNNER_TEMP=$RUNNER_TEMP" PYTHONDONTWRITEBYTECODE=1 "NUAAFA_TEST_EVIDENCE=$RUNNER_TEMP/rehearsal-output/case-logs" python3 driver/scripts/test-release-rehearsal.py --source="$GITHUB_WORKSPACE/candidate" --old-archive="$RUNNER_TEMP/$OLD.tar.gz" --new-archive="$RUNNER_TEMP/$NEW.tar.gz" --output="$RUNNER_TEMP/rehearsal-output"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: security-release-rehearsal-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/rehearsal-output/
          if-no-files-found: error
          retention-days: 5
# Only disposable GitHub-hosted runner state; no SSH, production credentials or deployment target.
