name: V2.10.x isolated admin validation
on:
  push:
    branches: [main, codex/v2.10x-admin-optimization, codex/security-remediation-20261022]
  pull_request:
    branches: [main, integration/v2.10-ui-release]
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: v210x-admin-${{ github.ref }}
  cancel-in-progress: false
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CHECKPOINT_DISABLE: '1'
      TZ: UTC
      REFEREE_ADMIN_SESSION_SECRET: Synthetic-V210x-CI-Admin-Secret-Only-2026
      REFEREE_MEMBER_SESSION_SECRET: Synthetic-V210x-CI-Member-Secret-Only-2026
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Isolated database and locked installation
        shell: bash
        run: |
          printf 'DATABASE_URL=file:%s/v210x-build.db\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          touch "$RUNNER_TEMP/v210x-build.db"
          npm ci --no-audit --no-fund
      - name: Competition reports, image privacy and exact migration policy
        run: |
          npx tsx scripts/test-competition-reports.ts
          python3 scripts/test-competition-report-migration-policy.py
          python3 scripts/test-resource-readiness.py
          python3 scripts/test-league-readiness.py
          npm run test:competition-league
          npm run test:homepage-competitions
      - name: Generate, migrate and build
        run: |
          npx prisma validate
          npx prisma migrate deploy
          npm run build
          npm run typecheck
          npm run lint
          UNICODE_BASE=704bf0af9e9b7f538cfbf6d3a76ec5f4148190e8 npm run check:unicode
      - name: Beijing time and business matrix in three Node timezones
        shell: bash
        run: |
          mkdir -p docs/v210x-admin/evidence
          TZ=Europe/London npm run test:v210x-admin > docs/v210x-admin/evidence/special-london.log 2>&1
          TZ=UTC npm run test:v210x-admin > docs/v210x-admin/evidence/special-utc.log 2>&1
          TZ=Asia/Shanghai npm run test:v210x-admin > docs/v210x-admin/evidence/special-shanghai.log 2>&1
          npm run test:v210x-migration
      - name: Existing application and real HTTP regressions
        run: |
          npm run test:audit-business
          npm run test:f03-schedule-compat
          npm run test:f03-schedule-compat:http
          npm run test:f03-tentative:http
          npm run test:referee-signup:http
          npm run test:referee-submission-requests
          TZ=UTC npm run test:targeted-followup
          TZ=Europe/London npm run test:targeted-followup
          TZ=Asia/Shanghai npm run test:targeted-followup
          npm run test:audit-public
          npm run test:team-directory-order
          npm run test:competition-presentation
          npm run test:media-history-catalogues
          npm run test:resource-library
          npm run test:referee-public-lists
          npm run test:home-notices
          npm run test:security-remediation
          npm run test:security-remediation:http
          npm run test:v210x-regressions
          npm run test:v210x-http-regressions
          SECURITY_R4A_F006_DATABASE_PATH="$RUNNER_TEMP/f006.db" node --import tsx scripts/test-security-r4a-f006-worker.ts
          node --import tsx scripts/test-restore-target-safety.ts
          npm run restore:rehearsal
          npm run test:clean-install
      - name: Install pinned browser test runtime in runner temp
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-package-lock --no-audit --no-fund --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/browser/node_modules/playwright/cli.js" install --with-deps chromium
          printf 'PLAYWRIGHT_MODULE=%s/browser/node_modules/playwright/index.mjs\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Browser timezone, privacy, workflow and responsive acceptance
        env:
          V210X_BROWSER_CHANNEL: chromium
        run: |
          AUDIT_BROWSER_CHANNEL=chromium npm run test:audit-business:http
          F06_BROWSER_CHANNEL=chromium npm run test:audit-network:browser
          TARGETED_BROWSER_CHANNEL=chromium npm run test:targeted-followup:browser
          AUDIT_BROWSER_CHANNEL=chromium npm run test:audit-public:http
          npm run test:v210x-browser
          REFEREE_LIST_BROWSER_CHANNEL=chromium REFEREE_LIST_BROWSER_ENGINES=chrome npm run test:referee-public-lists
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v210x-isolated-evidence-${{ github.sha }}-${{ github.run_id }}
          path: docs/v210x-admin/evidence/
          retention-days: 5
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm audit
      - run: npm audit --omit=dev
# No deploy, SSH, production credentials, migration of production data or release job.
  prebuilt:
    defaults:
      run:
        shell: bash
    name: Trusted Linux candidate archive and deployment safety
    if: github.repository == 'NUAAFA/NUAA-Football-Association' && (github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/codex/security-remediation-20261022' || github.ref == 'refs/heads/main')))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CHECKPOINT_DISABLE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      TZ: UTC
      REFEREE_ADMIN_SESSION_SECRET: Synthetic-V210x-CI-Admin-Secret-Only-2026
      REFEREE_MEMBER_SESSION_SECRET: Synthetic-V210x-CI-Member-Secret-Only-2026
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Exact head, locked install and synthetic build
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(uname -sm)" = 'Linux x86_64'
          test "$(node --version)" = v22.23.4
          test "$(cat /proc/1/comm)" = systemd
          cat /etc/os-release
          ldd --version
          node -p 'JSON.stringify(process.versions)'
          systemctl --version
          mkdir -p "$RUNNER_TEMP/prebuilt-output"
          git rev-parse HEAD > "$RUNNER_TEMP/prebuilt-output/checkout-identity.txt"
          printf 'DATABASE_URL=file:%s/readiness-build.db\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'NUAAFA_TEST_EVIDENCE=%s/prebuilt-output/case-logs\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          touch "$RUNNER_TEMP/readiness-build.db"
          npm ci --include=dev --include=optional --no-audit --no-fund
          npx prisma validate
          DATABASE_URL="file:$RUNNER_TEMP/readiness-build.db" npx prisma migrate deploy
          DATABASE_URL="file:$RUNNER_TEMP/readiness-build.db" npm run build
      - name: Migration policy, actual Bash failure and existing deployment regressions
        run: |
          python3 scripts/test-production-readiness.py
          python3 scripts/test-league-readiness.py
          python3 scripts/test-resource-readiness.py
          python3 scripts/test-prebuilt-pack.py
          python3 scripts/test-prebuilt-artifact.py
          python3 scripts/test-deploy-recovery-health.py
          sudo env "PATH=$PATH" PYTHONDONTWRITEBYTECODE=1 NUAAFA_TEST_ROOT=/var/lib "NUAAFA_TEST_APP_USER=$(id -un)" python3 scripts/test-start-prebuilt.py
          npm run test:deployer
          sudo env "PATH=$PATH" PYTHONDONTWRITEBYTECODE=1 "NUAAFA_TEST_EVIDENCE=$NUAAFA_TEST_EVIDENCE" python3 scripts/test-prebuilt-linux.py
      - name: Seal, verify, actually import twice and start exact Linux runtime
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 ops/deploy/prebuilt-artifact.py pack --source="$GITHUB_WORKSPACE" --commit="$EXPECTED_SOURCE_SHA" --output="$RUNNER_TEMP/prebuilt-output/nuaafa-$EXPECTED_SOURCE_SHA.tar.gz"
          digest="$(sha256sum "$RUNNER_TEMP/prebuilt-output/nuaafa-$EXPECTED_SOURCE_SHA.tar.gz" | cut -d ' ' -f 1)"
          sudo env "PATH=$PATH" PYTHONDONTWRITEBYTECODE=1 NUAAFA_TEST_SYSTEMD=1 "NUAAFA_TEST_EVIDENCE=$NUAAFA_TEST_EVIDENCE" python3 scripts/test-prebuilt-linux.py --archive="$RUNNER_TEMP/prebuilt-output/nuaafa-$EXPECTED_SOURCE_SHA.tar.gz" --commit="$EXPECTED_SOURCE_SHA" --sha256="$digest" | tee "$RUNNER_TEMP/prebuilt-output/runtime-validation.json"
          (cd "$RUNNER_TEMP/prebuilt-output" && sha256sum -c ./*.sha256)
          # Trusted root tools stay separate from untrusted runtime payloads.
          mkdir "$RUNNER_TEMP/prebuilt-output/trusted-tools"
          cp ops/deploy/prebuilt-artifact.py ops/deploy/nuaafa-deploy ops/deploy/start-prebuilt "$RUNNER_TEMP/prebuilt-output/trusted-tools/"
          sha256sum "$RUNNER_TEMP/prebuilt-output/trusted-tools/"* > "$RUNNER_TEMP/prebuilt-output/trusted-tools.sha256"
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'prebuilt-output'; sha=os.environ['EXPECTED_SOURCE_SHA']; archive=root/('nuaafa-'+sha+'.tar.gz')
          result={'source_commit':sha,'source_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'run_id':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'archive_sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),'lock_sha256':hashlib.sha256(Path('package-lock.json').read_bytes()).hexdigest(),'schema_sha256':hashlib.sha256(Path('prisma/schema.prisma').read_bytes()).hexdigest(),'migration_count':len(list(Path('prisma/migrations').glob('*/migration.sql'))),'release_allowed':False,'human_approval':'NOT GENERATED'}
          (root/'authenticated-candidate.json').write_text(json.dumps(result,indent=2)+'\n'); print(json.dumps(result,indent=2))
          PY
          sha256sum "$RUNNER_TEMP/prebuilt-output/"*.tar.gz >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nuaafa-prebuilt-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prebuilt-output/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
