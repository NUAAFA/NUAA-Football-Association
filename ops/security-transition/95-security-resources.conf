# Proposed nuaafa.service drop-in. Requires an approved maintenance restart.
[Service]
CPUAccounting=yes
MemoryAccounting=yes
TasksAccounting=yes
CPUQuota=100%
MemoryHigh=1G
MemoryMax=1536M
TasksMax=128
# Retain the existing graceful-stop contract. MemoryMax remains a last-resort
# OOM boundary and is not a guarantee that the kernel cannot kill a process.
KillMode=control-group
SendSIGKILL=no
TimeoutStopSec=infinity
