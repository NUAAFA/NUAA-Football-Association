# Proposed HTTPS server-context include; preserve the existing TLS, WSS,
# maintenance handling and all other locations. No cache is introduced.
location ~ ^/api/referees/(?:(?:admin/)?(?:login|account/password)|admission-applications)$ {
    client_max_body_size 16k;
    client_body_timeout 15s;
    limit_req zone=nuaafa_security_auth_ip burst=20 nodelay;
    limit_req zone=nuaafa_security_auth_total burst=40 nodelay;
    limit_req_status 429;
    limit_req_log_level notice;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
